name: CADD PHRED Score Converter CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest Suite
      run: |
        python -m pytest -p no:zarr -v

    - name: CLI Batch Smoke Test
      run: |
        python cli.py batch -i sample.csv -o out_smoke.csv
        python -c "
        import csv
        with open('out_smoke.csv', 'r') as f:
            reader = list(csv.DictReader(f))
            assert len(reader) == 6, f'Expected 6 rows, got {len(reader)}'
            assert 'cadd_phred' in reader[0]
            assert 'acmg_code' in reader[0]
        print('CLI batch smoke test succeeded!')
        "
        rm -f out_smoke.csv
